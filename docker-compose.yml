services:
  app:
    build: .
    image: activation-service:local
    ports:
      - "${SERVER_PORT:-8080}:8080"
    # Valores vêm do .env (opcional; ver .env.example). Os endereços entre contêineres são fixos.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-activation}
      DB_USER: ${DB_USER:-activation}
      DB_PASSWORD: ${DB_PASSWORD:-activation}
      PROVIDER_BASE_URL: http://provider-mock:8080
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-local-dev-key}
      PROVIDER_CONNECT_TIMEOUT: ${PROVIDER_CONNECT_TIMEOUT:-2s}
      PROVIDER_READ_TIMEOUT: ${PROVIDER_READ_TIMEOUT:-5s}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
      WORKER_RECONCILE_INTERVAL: ${WORKER_RECONCILE_INTERVAL:-1m}
      # Tokens são pedidos pelo host (localhost:8180), então esse é o emissor;
      # já as chaves a aplicação busca pela rede interna do compose.
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8180/realms/activation}
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/activation/protocol/openid-connect/certs
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-activation-service}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-activation}
      POSTGRES_USER: ${DB_USER:-activation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-activation}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.2
    command: ["--port", "8080", "--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emissor de tokens apenas para desenvolvimento local (start-dev, sem TLS e sem banco persistente).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
