services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.2
    command: ["--port", "8080", "--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
