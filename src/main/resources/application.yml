spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USER:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
