spring:
  application:
    name: activation-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USER:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

activation:
  security:
    issuer: ${OAUTH_ISSUER:http://localhost:8180/realms/activation}
    jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8180/realms/activation/protocol/openid-connect/certs}
    audience: ${OAUTH_AUDIENCE:activation-service}
    clock-skew: 30s
    max-body-size: 16KB
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    api-key: ${PROVIDER_API_KEY:local-dev-key}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  worker:
    enabled: ${WORKER_ENABLED:true}
    poll-interval: ${WORKER_POLL_INTERVAL:2s}
    reconcile-interval: ${WORKER_RECONCILE_INTERVAL:1m}
    batch-size: 10
    max-attempts: 5
    backoff-base: 2s
    backoff-cap: 5m
    processing-lease: 5m

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
